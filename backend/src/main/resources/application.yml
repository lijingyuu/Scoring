spring:
  application:
    name: scoring-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/scoring_mvp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:scoring_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 显式连接池：结算/记分链路大量 FOR UPDATE 行锁，默认池 10 在多场地并发下会排队
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # 获取连接 8s 快速失败，避免池耗尽时请求静默挂 30s
      connection-timeout: 8000
  flyway:
    enabled: true
    validate-on-migrate: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  auth:
    jwt-secret: ${JWT_SECRET:change-me-jwt-secret}
    jwt-expire-seconds: ${JWT_EXPIRE_SECONDS:2592000}
    registration-enabled: ${REGISTRATION_ENABLED:true}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    qr-check-path: ${WECHAT_QR_CHECK_PATH:true}
    qr-env-version: ${WECHAT_QR_ENV_VERSION:release}
  upload:
    directory: ${UPLOAD_DIR:./uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080}

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

server:
  port: 8080
