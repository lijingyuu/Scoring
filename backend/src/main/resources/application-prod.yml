spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    jwt-expire-seconds: ${JWT_EXPIRE_SECONDS:2592000}
    registration-enabled: ${REGISTRATION_ENABLED:true}
  wechat:
    app-id: ${WECHAT_APP_ID}
    app-secret: ${WECHAT_APP_SECRET}
    mock-login-enabled: false
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN_1}
      - ${CORS_ALLOWED_ORIGIN_2:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-limit-per-minute: ${LOGIN_LIMIT_PER_MINUTE:20}
    write-limit-per-minute: ${WRITE_LIMIT_PER_MINUTE:60}
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}

logging:
  level:
    root: INFO
    com.scoring.backend: INFO
