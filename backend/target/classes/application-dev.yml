spring:
  datasource:
    url: jdbc:h2:mem:scoring_mvp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

app:
  auth:
    jwt-secret: ${JWT_SECRET:dev-jwt-secret}
    jwt-expire-seconds: ${JWT_EXPIRE_SECONDS:2592000}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
